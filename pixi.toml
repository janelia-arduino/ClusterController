[workspace]
name = "ClusterController"
version = "4.3.0"
description = "Firmware for controlling a cluster of prism actuators."
authors = ["Peter Polidoro <peter@polidoro.io>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
platformio = ">=6.1.19,<7"
python = ">=3.12,<=3.14"
git = "*"

[pypi-dependencies]
click = ">=8.1"
python3-nmap = ">=1.9"
pytest = ">=8.0"
ruff = ">=0.11"
build = ">=1.2"
twine = ">=5.1"

[tasks]
ports = "pio device list"
pio-version = "pio --version"
ql-install = "python tools/quantum_leaps_tools.py install"
qm = "python tools/quantum_leaps_tools.py qm"
qm-install = "python tools/quantum_leaps_tools.py qm --install-only"
codegen = "python tools/qm_codegen.py"
check-qm-sync = "python tools/check_qm_sync.py"
qtools-install = "python tools/quantum_leaps_tools.py qtools-install"
qspy = "python tools/quantum_leaps_tools.py qspy"
hex-path = "python tools/hex_maze_tasks.py repo-path"
hex-python = "python tools/hex_maze_tasks.py python"
hex-help = "python tools/hex_maze_tasks.py help"
hex-discover = "python tools/hex_maze_tasks.py discover"
hex-verify = "python tools/hex_maze_tasks.py verify"
hex-format = "python tools/hex_maze_tasks.py format"
hex-lint = "python tools/hex_maze_tasks.py lint"
hex-test = "python tools/hex_maze_tasks.py test"
hex-check = "python tools/hex_maze_tasks.py check"
hex-build = "python tools/hex_maze_tasks.py build"
hex-check-dist = "python tools/hex_maze_tasks.py check-dist"
hex-release-check = "python tools/hex_maze_tasks.py release-check"
hardware-smoke = "python tools/hex_maze_tasks.py hardware-smoke"
hardware-gui-sequence = "python tools/hex_maze_tasks.py hardware-gui-sequence"
hardware-repeated-home = "python tools/hex_maze_tasks.py hardware-repeated-home"
hardware-regression = "python tools/hex_maze_tasks.py hardware-regression"
hardware-edge = "python tools/hex_maze_tasks.py hardware-edge"
hardware-acceptance = "python tools/hex_maze_tasks.py hardware-acceptance"
repro-post-home = "python tools/hex_maze_tasks.py repro-post-home"

[tasks.build]
cmd = "pio run -e pico-rewrite"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[tasks.build-rewrite]
cmd = "pio run -e pico-rewrite"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[tasks.clean]
cmd = "pio run -e pico-rewrite -t clean"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[tasks.rebuild]
depends-on = ["clean", "build"]

[tasks.upload]
cmd = "pio run -e pico-rewrite -t upload"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[tasks.upload-rewrite]
cmd = "pio run -e pico-rewrite -t upload"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[tasks.flash]
depends-on = ["upload"]

[tasks.flash-rewrite]
depends-on = ["upload-rewrite"]

[tasks.export-rewrite]
cmd = "python tools/export_firmware_artifacts.py"

[tasks.export-artifacts]
depends-on = ["export-rewrite"]

[tasks.flash-artifact-rewrite]
cmd = "python tools/flash_firmware_artifact.py artifacts/firmware/clustercontroller-rewrite.uf2"

[tasks.monitor]
cmd = "pio device monitor --echo --eol=LF --baud 115200"
env = { PLATFORMIO_CORE_DIR = ".platformio" }

[target.linux-64.dependencies]
make = "*"
c-compiler = "*"

[target.osx-64.dependencies]
make = "*"
c-compiler = "*"

[target.osx-arm64.dependencies]
make = "*"
c-compiler = "*"
