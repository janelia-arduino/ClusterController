[platformio]
src_dir = firmware

lib_dir = src
default_envs = pico-rewrite

[common_env_data]
build_flags =
    -Isrc
lib_deps_external =
    https://github.com/janelia-arduino/qp-arduino.git#master
    https://github.com/janelia-arduino/TCA6408.git#1.0.0
    https://github.com/janelia-arduino/TMC51X0.git#4.0.0

[env]
lib_ldf_mode = off
build_flags =
    ${common_env_data.build_flags}
monitor_echo = yes
monitor_eol = LF
monitor_filters =
    send_on_enter
    colorize
monitor_speed = 115200

[env:teensy40]
framework = arduino
platform = teensy
board = teensy40
upload_protocol = teensy-cli

[env:pico-legacy]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5500_evb_pico
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
build_src_filter =
    +<*>
lib_ignore =
    ClusterControllerRewrite
lib_deps =
    Ticker
    SPI
    Wire
    ${common_env_data.lib_deps_external}
    src/ClusterController

[env:pico-rewrite]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5500_evb_pico
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
lib_ldf_mode = chain+
build_flags =
    ${common_env_data.build_flags}
    -DCLUSTER_CONTROLLER_REWRITE
build_src_filter =
    +<main.cpp>
    +<rewrite_app.cpp>
    +<rewrite_bsp.cpp>
    +<rewrite_cluster_address.cpp>
    +<rewrite_network.cpp>
    +<rewrite_prism.cpp>
lib_deps =
    Ticker
    SPI
    Wire
    https://github.com/janelia-arduino/TCA6408.git#1.0.0
    https://github.com/janelia-arduino/TMC51X0.git#4.0.0

[env:feather-rewrite]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool
lib_ldf_mode = chain+
build_flags =
    ${common_env_data.build_flags}
    -DCLUSTER_CONTROLLER_REWRITE
build_src_filter =
    +<main.cpp>
    +<rewrite_app.cpp>
    +<rewrite_bsp.cpp>
    +<rewrite_cluster_address.cpp>
    +<rewrite_network.cpp>
    +<rewrite_prism.cpp>
lib_deps =
    Ticker
    SPI
    Wire
    https://github.com/janelia-arduino/TCA6408.git#1.0.0
    https://github.com/janelia-arduino/TMC51X0.git#4.0.0

; Legacy firmware:
;   pio run -e pico-legacy
;
; Rewrite firmware:
;   pio run -e pico-rewrite
;   pio run -e feather-rewrite
